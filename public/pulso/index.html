<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F7">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pulso · Binance en vivo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#EAEEF3;--ink:#0F1720;--muted:#5A6676;--line:#DDE3EA;
  --accent:#1F4FD1;--accent-ink:#FFFFFF;--accent-text:#1F4FD1;--accent-bg:#E6EDFC;
  --up:#077A55;--up-bg:#DDF3EA;--down:#C0342A;--down-bg:#FBE4E1;--warn:#9A5B00;--warn-bg:#FCEFD3;--info-bg:#E6EDFC;
  --tag-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,23,32,.05),0 4px 14px rgba(15,23,32,.05);
  --f-disp:'Bricolage Grotesque','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1016;--surface:#121922;--surface-2:#1A2430;--ink:#E9EEF3;--muted:#93A1B1;--line:#263241;
    --accent:#3A68E0;--accent-ink:#FFFFFF;--accent-text:#8DB4FF;--accent-bg:#172B52;
    --up:#35C48F;--up-bg:#10372B;--down:#FF6B5B;--down-bg:#3D1A17;--warn:#F2B84B;--warn-bg:#3A2D10;--info-bg:#172B52;
    --tag-ink:#07110D;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1016;--surface:#121922;--surface-2:#1A2430;--ink:#E9EEF3;--muted:#93A1B1;--line:#263241;
  --accent:#3A68E0;--accent-ink:#FFFFFF;--accent-text:#8DB4FF;--accent-bg:#172B52;
  --up:#35C48F;--up-bg:#10372B;--down:#FF6B5B;--down-bg:#3D1A17;--warn:#F2B84B;--warn-bg:#3A2D10;--info-bg:#172B52;
  --tag-ink:#07110D;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico{display:inline-grid;place-items:center;line-height:0}
.app{max-width:720px;margin:0 auto}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.view{display:flex;flex-direction:column;gap:12px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-name{font:700 21px/1 var(--f-disp);letter-spacing:-.02em}
.status{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{position:relative;width:10px;height:10px;border-radius:50%;background:var(--muted);color:var(--muted);flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0}
.pulse[data-s=live]{background:var(--up);color:var(--up)}
.pulse[data-s=live]::after{animation:ring 2s ease-out infinite}
.pulse[data-s=poll]{background:var(--warn);color:var(--warn)}
.pulse[data-s=down]{background:var(--down);color:var(--down)}
.pulse[data-s=connecting]{background:var(--warn);animation:blink 1s ease-in-out infinite}
.pulse[data-s=demo]{background:var(--accent-text);color:var(--accent-text)}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes blink{50%{opacity:.35}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.banner{margin:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:10px 12px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--down-bg);color:var(--down)}
.banner.info{background:var(--info-bg);color:var(--accent-text)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 4px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--accent-text)}
.tab .badge{position:absolute;margin:-6px 0 0 18px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--down);color:#fff;font:600 10px/16px var(--f-sans);text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card-t{font:600 12px/1.2 var(--f-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.t-up{color:var(--up)}.t-down{color:var(--down)}.t-warn{color:var(--warn)}
.mono{font-family:var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font:600 12.5px/1.5 var(--f-sans);background:var(--surface-2);color:var(--muted)}
.pill.up{background:var(--up-bg);color:var(--up)}
.pill.down{background:var(--down-bg);color:var(--down)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.danger{color:var(--down)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:none;border-radius:12px;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.danger:hover{color:var(--down)}

.form{display:grid;gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
.input,.select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px}
.input:focus,.select:focus{outline:2px solid var(--accent-text);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.form-err{color:var(--down);font-size:14px}
.form-prev{font-size:14px;color:var(--muted)}

.toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 12px;pointer-events:none}
.toast{pointer-events:auto;position:relative;width:min(100%,460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 44px 12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:toastIn .25s ease-out;cursor:pointer}
.toast-t{font-weight:600}
.toast-b{font-size:14px;opacity:.9}
.toast-x{position:absolute;top:2px;right:2px;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:inherit;opacity:.7}
.toast-x svg{width:18px;height:18px}
.toast.info{padding:10px 14px}
.tools{display:grid;gap:10px}
.search{position:relative}
.search .input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.brief-list{display:grid;gap:8px}
.brief-list li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;font-size:14.5px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.dot.up{background:var(--up)}.dot.down{background:var(--down)}.dot.warn{background:var(--warn)}
.radar{display:grid;gap:12px}
.radar-grp{display:grid;gap:6px}
.radar-grp h3{font:600 14px/1.25 var(--f-sans);letter-spacing:0}
.radar .chips{gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true] svg{fill:currentColor}
.chip.rc{min-height:32px;padding:0 10px;gap:5px;font-size:13.5px}
.chip.rc b{font-family:var(--f-mono);font-weight:500}
.chip.rc span{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.chip.rc.up span{color:var(--up)}.chip.rc.down span{color:var(--down)}.chip.rc.warn span{color:var(--warn)}

.coins{display:grid;gap:8px}
.coin{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.star{width:44px;height:56px;display:grid;place-items:center;border:0;background:none;color:var(--muted)}
.star svg{width:20px;height:20px}
.star[aria-pressed=true]{color:var(--warn)}
.star[aria-pressed=true] svg{fill:currentColor}
.coin-main{display:grid;grid-template-columns:minmax(0,1fr) 56px auto 40px;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px 8px 0;min-height:56px;width:100%;min-width:0}
.coin-id{min-width:0;display:grid}
.coin-id b{font-weight:600}
.coin-id small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:56px;height:24px;overflow:visible;color:var(--muted)}
.spark path{fill:none;stroke:currentColor;stroke-width:1.6}
.spark.up{color:var(--up)}.spark.down{color:var(--down)}
.coin-px{display:grid;justify-items:end;text-align:right}
.px{font:500 15px/1.25 var(--f-mono);padding:0 4px;border-radius:6px}
.chg{font:500 12.5px/1.3 var(--f-mono);color:var(--muted)}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.score{display:grid;place-items:center;width:38px;height:28px;border-radius:8px;font:600 13px var(--f-mono);background:var(--surface-2);color:var(--muted)}
.score.up{background:var(--up-bg);color:var(--up)}
.score.down{background:var(--down-bg);color:var(--down)}
.score.warn{background:var(--warn-bg);color:var(--warn)}
@keyframes flUpA{from{background:var(--up-bg)}to{background:transparent}}
@keyframes flUpB{from{background:var(--up-bg)}to{background:transparent}}
@keyframes flDnA{from{background:var(--down-bg)}to{background:transparent}}
@keyframes flDnB{from{background:var(--down-bg)}to{background:transparent}}
.fl-up-a{animation:flUpA .8s ease-out}.fl-up-b{animation:flUpB .8s ease-out}
.fl-dn-a{animation:flDnA .8s ease-out}.fl-dn-b{animation:flDnB .8s ease-out}
@media (max-width:359px){.spark{display:none}.coin-main{grid-template-columns:minmax(0,1fr) auto 38px}}
.skel{height:58px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
.disc{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 8px 0}
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.sheet-scrim{position:absolute;inset:0;background:rgba(8,12,18,.5)}
.sheet-panel{position:relative;width:100%;max-width:560px;height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);animation:slideIn .22s ease-out}
@media (max-width:640px){.sheet-panel{max-width:none}}
.sheet-head{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);background:var(--bg);padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px))}
.sheet-head .star{height:44px}
.sheet-head h2{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head h2 small{font:400 14px var(--f-sans);color:var(--muted);margin-left:6px}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-body>*{flex:none}
.price-big{font:500 34px/1.1 var(--f-mono);letter-spacing:-.02em}
.price-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.chart-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px}
canvas.chart{display:block;width:100%;height:250px;touch-action:pan-y;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent-text);vertical-align:middle;margin-right:6px}
.gauge{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin:2px 0 8px}
.gauge-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gauge-bar i{display:block;height:100%;border-radius:99px;background:var(--muted);transition:width .4s}
.gauge-bar.up i{background:var(--up)}.gauge-bar.down i{background:var(--down)}.gauge-bar.warn i{background:var(--warn)}
.gauge b{font:600 24px/1 var(--f-mono)}
.gauge small{color:var(--muted);font:400 13px var(--f-sans)}
.perfil{font:700 18px/1.25 var(--f-disp)}
.sumline{margin-top:6px;font-size:14.5px}
.lst{display:grid;gap:6px;margin-top:12px}
.lst h4{font:600 12px var(--f-sans);letter-spacing:.07em;text-transform:uppercase}
.lst.pro h4,.lst.pro li::before{color:var(--up)}
.lst.con h4,.lst.con li::before{color:var(--down)}
.lst.note h4,.lst.note li::before{color:var(--muted)}
.lst li{position:relative;padding-left:16px;font-size:14.5px}
.lst li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:currentColor}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0}
.stats div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-family:var(--f-mono);text-align:right}
@media (max-width:440px){.stats{grid-template-columns:1fr}}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font:500 22px var(--f-mono);color:var(--muted)}
details.card[open]>summary::after{content:"−"}
details.card[open]>summary{margin-bottom:12px}
.stale{font-size:12.5px;color:var(--warn)}
.perm{display:grid;gap:10px}
.perm .acts{display:flex;flex-wrap:wrap;gap:8px}
.alert-list,.pos-list,.log-list{display:grid;gap:8px}
.alert-item,.pos-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 8px 14px}
.al-title{font-weight:600;min-width:0;overflow-wrap:anywhere}
.al-title button{border:0;background:none;padding:0;font-weight:700;color:var(--accent-text)}
.al-sub{grid-column:1;font-size:13px;color:var(--muted);min-width:0}
.al-act{grid-row:1/span 2;grid-column:2;display:flex;align-items:center;gap:0}
.alert-item.fired{opacity:.85}
.log-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.log-list li:last-child{border-bottom:0}
.log-list time{color:var(--muted);font:400 12.5px var(--f-mono);white-space:nowrap;padding-top:2px}
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum-grid .wide{grid-column:1/-1}
.sum-grid div{display:grid;gap:2px;min-width:0}
.sum-grid small{color:var(--muted);font-size:12px}
.sum-grid b{font:500 16px/1.25 var(--f-mono);overflow-wrap:anywhere}
.pos-main{grid-column:1;min-width:0}
.pos-pl{font:500 14px var(--f-mono)}
.res{background:var(--surface-2);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:14.5px}
.res b{font-family:var(--f-mono);font-weight:500}
.res .warnline{color:var(--warn);font-size:13.5px}
.learn{display:grid;gap:8px}
.learn details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;box-shadow:var(--shadow)}
.learn summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px;font:600 15.5px/1.3 var(--f-disp)}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";font:500 22px var(--f-mono);color:var(--muted)}
.learn details[open] summary::after{content:"−"}
.learn .body{display:grid;gap:8px;padding:0 0 14px;font-size:14.5px}
.learn .body code{font-family:var(--f-mono);background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13.5px;overflow-wrap:anywhere}
.learn .body ul{display:grid;gap:4px;padding-left:18px;list-style:disc}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-weight:600}
.set-row .hint{margin-top:1px}
.sw{position:relative;flex:none;width:48px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked=true]{background:var(--accent);border-color:transparent}
.sw[aria-checked=true]::after{transform:translateX(20px);background:#fff}

<noscript><p style="padding:24px;font-family:sans-serif">Pulso necesita JavaScript activado para funcionar.</p></noscript>
<script>
'use strict';
/* ==========================================================================
   Pulso · núcleo puro (sin DOM): formato, indicadores, análisis y alertas
   ========================================================================== */

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const mean = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN);
const median = (a) => {
  if (!a.length) return NaN;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
const MINUS = '−';
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const NAMES = {
  BTC: 'Bitcoin', ETH: 'Ethereum', BNB: 'BNB', SOL: 'Solana', XRP: 'XRP', DOGE: 'Dogecoin', ADA: 'Cardano',
  TRX: 'TRON', AVAX: 'Avalanche', LINK: 'Chainlink', DOT: 'Polkadot', LTC: 'Litecoin', BCH: 'Bitcoin Cash',
  NEAR: 'NEAR', UNI: 'Uniswap', ATOM: 'Cosmos', XLM: 'Stellar', ETC: 'Ethereum Classic', FIL: 'Filecoin',
  APT: 'Aptos', ARB: 'Arbitrum', OP: 'Optimism', INJ: 'Injective', SUI: 'Sui', SEI: 'Sei', PEPE: 'Pepe',
  SHIB: 'Shiba Inu', AAVE: 'Aave', MKR: 'Maker', HBAR: 'Hedera', ICP: 'Internet Computer', RUNE: 'THORChain',
  TON: 'Toncoin', POL: 'Polygon', TIA: 'Celestia', WLD: 'Worldcoin', JUP: 'Jupiter', ENA: 'Ethena',
  RENDER: 'Render', IMX: 'Immutable', CRV: 'Curve', ALGO: 'Algorand', VET: 'VeChain',
};

const baseOf = (sym) => (sym.endsWith('USDT') ? sym.slice(0, -4) : sym);
function normSym(v) {
  const s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!s) return '';
  return s.endsWith('USDT') && s.length > 4 ? s : s + 'USDT';
}

/* ---------- formato ---------- */
function fmtPrice(p) {
  if (p == null || !isFinite(p)) return '—';
  const a = Math.abs(p);
  const d = a >= 100 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : a >= 0.1 ? 5 : a >= 0.01 ? 6 : 8;
  return p.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtNum(x, d = 2) {
  return x == null || !isFinite(x) ? '—' : x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtUSDT(x) {
  if (x == null || !isFinite(x)) return '—';
  const a = Math.abs(x);
  return fmtNum(x, a >= 1 || a === 0 ? 2 : a >= 0.01 ? 4 : 6);
}
function fmtQty(q) {
  if (q == null || !isFinite(q)) return '—';
  const a = Math.abs(q);
  return q.toLocaleString('en-US', { maximumFractionDigits: a >= 1000 ? 2 : a >= 1 ? 4 : 8 });
}
function fmtPct(p, d = 2) {
  if (p == null || !isFinite(p)) return '—';
  const r = Math.abs(p).toFixed(d);
  if (Number(r) === 0) return r + '%';
  return (p > 0 ? '+' : MINUS) + r + '%';
}
function fmtBig(x) {
  if (x == null || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a >= 1e9) return (x / 1e9).toFixed(1) + ' mil M';
  if (a >= 1e6) return (x / 1e6).toFixed(1) + ' M';
  if (a >= 1e3) return (x / 1e3).toFixed(1) + ' K';
  return x.toFixed(0);
}
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + ' s';
  const m = Math.round(s / 60);
  if (m < 60) return m + ' min';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' h';
  return Math.round(h / 24) + ' d';
}
function fmtAxisTime(ms, iv, multiDay) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  if (iv === '1d') return d.getDate() + ' ' + MES[d.getMonth()];
  if (multiDay) return d.getDate() + ' ' + MES[d.getMonth()] + ' ' + p(d.getHours()) + 'h';
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtFull(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return d.getDate() + ' ' + MES[d.getMonth()] + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* Acepta "70000", "70,000", "0,5", "1.234,56", "1,234.56" */
function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/[\s_]/g, '');
  if (!s) return NaN;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (hasC && hasD) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasC) {
    if (/^[1-9]\d{0,2}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
  } else if (hasD && /^[1-9]\d{0,2}(\.\d{3}){2,}$/.test(s)) {
    s = s.replace(/\./g, '');
  }
  return /^-?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s) ? Number(s) : NaN;
}

/* ---------- indicadores ---------- */
function sma(a, n) {
  if (a.length < n) return null;
  let s = 0;
  for (let i = a.length - n; i < a.length; i++) s += a[i];
  return s / n;
}
function smaSeries(a, n) {
  const out = new Array(a.length).fill(null);
  let s = 0;
  for (let i = 0; i < a.length; i++) {
    s += a[i];
    if (i >= n) s -= a[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
/* RSI de Wilder */
function rsi(c, n = 14) {
  if (c.length < n + 1) return null;
  let gain = 0, loss = 0;
  for (let i = 1; i <= n; i++) {
    const d = c[i] - c[i - 1];
    if (d >= 0) gain += d; else loss -= d;
  }
  gain /= n; loss /= n;
  for (let i = n + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    gain = (gain * (n - 1) + (d > 0 ? d : 0)) / n;
    loss = (loss * (n - 1) + (d < 0 ? -d : 0)) / n;
  }
  if (loss === 0) return gain === 0 ? 50 : 100;
  return 100 - 100 / (1 + gain / loss);
}
/* Desviación estándar de los retornos diarios, en % */
function dailyVol(c, n = 14) {
  if (c.length < n + 1) return null;
  const r = [];
  for (let i = c.length - n; i < c.length; i++) r.push(c[i] / c[i - 1] - 1);
  const m = mean(r);
  const v = r.reduce((a, b) => a + (b - m) * (b - m), 0) / (r.length - 1);
  return Math.sqrt(v) * 100;
}
function pctChange(c, k) {
  const i = c.length - 1 - k;
  return i >= 0 && c[i] > 0 ? (c[c.length - 1] / c[i] - 1) * 100 : null;
}

/* ---------- análisis ---------- */
const RSI_ZONE = [[0, 10], [30, 25], [40, 50], [50, 85], [60, 100], [65, 95], [70, 60], [75, 30], [80, 10], [100, 0]];
function zoneScore(r) {
  if (r == null) return null;
  for (let i = 1; i < RSI_ZONE.length; i++) {
    if (r <= RSI_ZONE[i][0]) {
      const [x0, y0] = RSI_ZONE[i - 1], [x1, y1] = RSI_ZONE[i];
      return lerp(y0, y1, (r - x0) / (x1 - x0));
    }
  }
  return 0;
}

/* x = { price, ch24, qvol24, h1c[], d1c[], d1h[], d1q[] }  (la última vela ya incluye el precio en vivo) */
function analyze(x) {
  const P = x.price, hc = x.h1c, dc = x.d1c;
  if (!(P > 0) || !hc || hc.length < 51 || !dc || dc.length < 21) return null;

  const sma20h = sma(hc, 20), sma50h = sma(hc, 50);
  const sma20d = sma(dc, 20), sma50d = dc.length >= 50 ? sma(dc, 50) : null;
  const rsiH = rsi(hc, 14), rsiD = rsi(dc, 14);
  const ch7 = pctChange(dc, 7), ch30 = pctChange(dc, 30);
  const vol = dailyVol(dc, 14);

  let relVol = null;
  if (x.d1q && x.d1q.length >= 21 && x.qvol24 > 0) {
    const avg = mean(x.d1q.slice(-21, -1));
    if (avg > 0) relVol = x.qvol24 / avg;
  }
  let hi30 = null, fromHigh = null;
  if (x.d1h && x.d1h.length >= 10) {
    hi30 = Math.max(P, ...x.d1h.slice(-30));
    fromHigh = (P / hi30 - 1) * 100;
  }

  const conds = [
    { ok: P > sma20d },
    sma50d != null && { ok: P > sma50d },
    sma50d != null && { ok: sma20d > sma50d },
    { ok: P > sma20h },
    { ok: sma20h > sma50h },
  ].filter(Boolean);
  const okN = conds.filter((c) => c.ok).length;
  const trend = (100 * okN) / conds.length;

  const impulse = ch7 == null ? 50 : 100 * (0.7 * clamp((ch7 + 10) / 30, 0, 1) + 0.3 * clamp((x.ch24 + 5) / 10, 0, 1));
  const rz = mean([zoneScore(rsiH), zoneScore(rsiD)].filter((v) => v != null));
  const fuerza = Math.round(0.5 * trend + 0.3 * impulse + 0.2 * rz);

  const over = rsiH >= 70 || rsiD >= 70;
  const under = rsiH <= 30 || rsiD <= 30;
  const risk = vol == null ? null : vol < 2.5 ? 'Bajo' : vol < 5 ? 'Medio' : vol < 8 ? 'Alto' : 'Muy alto';

  let perfil, tono;
  if (over && fuerza >= 55) { perfil = 'Fuerte, pero recalentada'; tono = 'warn'; }
  else if (over) { perfil = 'Recalentada'; tono = 'warn'; }
  else if (under) { perfil = 'Cayó mucho; puede rebotar o seguir bajando'; tono = 'warn'; }
  else if (fuerza >= 70) { perfil = 'Tendencia fuerte'; tono = 'up'; }
  else if (fuerza >= 55) { perfil = 'Tendencia moderada al alza'; tono = 'up'; }
  else if (fuerza <= 30) { perfil = 'Tendencia débil'; tono = 'down'; }
  else if (fuerza <= 45) { perfil = 'Tendencia moderada a la baja'; tono = 'down'; }
  else { perfil = 'Mixta, sin dirección clara'; tono = 'neutral'; }

  const pros = [], cons = [], notes = [];
  if (trend >= 80) pros.push(`Tendencia alcista: ${okN} de ${conds.length} señales a favor.`);
  else if (trend <= 20) cons.push(`Tendencia bajista: solo ${okN} de ${conds.length} señales a favor.`);
  else notes.push(`Tendencia mixta: ${okN} de ${conds.length} señales a favor.`);

  if (ch7 != null) {
    if (ch7 > 5) pros.push(`Subió ${ch7.toFixed(1)}% en 7 días.`);
    else if (ch7 < -5) cons.push(`Bajó ${Math.abs(ch7).toFixed(1)}% en 7 días.`);
    else notes.push(`Casi sin cambio en 7 días (${fmtPct(ch7, 1)}).`);
  }
  if (rsiD != null) {
    if (rsiD >= 70) cons.push(`RSI diario en ${rsiD.toFixed(0)}: sobrecompra. Tras subidas rápidas son comunes las pausas o correcciones.`);
    else if (rsiD <= 30) cons.push(`RSI diario en ${rsiD.toFixed(0)}: sobreventa. Puede rebotar, pero también seguir cayendo.`);
    else if (rsiD >= 45) pros.push(`RSI diario en ${rsiD.toFixed(0)}: zona sana, sin exceso.`);
    else notes.push(`RSI diario en ${rsiD.toFixed(0)}: momentum flojo.`);
  }
  if (rsiH != null && rsiH >= 70) cons.push(`RSI de 1 h en ${rsiH.toFixed(0)}: sobrecompra de corto plazo.`);
  if (rsiH != null && rsiH <= 30) notes.push(`RSI de 1 h en ${rsiH.toFixed(0)}: sobreventa de corto plazo.`);
  if (relVol != null) {
    if (relVol >= 1.5) (x.ch24 >= 0 ? pros : cons).push(`Volumen ${relVol.toFixed(1)}× lo normal con el precio ${x.ch24 >= 0 ? 'al alza' : 'a la baja'}.`);
    else if (relVol <= 0.6) notes.push(`Volumen bajo (${relVol.toFixed(1)}× lo normal): poco interés hoy.`);
  }
  if (fromHigh != null) {
    if (fromHigh >= -3) notes.push('Cerca de su máximo de 30 días.');
    else if (fromHigh <= -25) cons.push(`Está ${Math.abs(fromHigh).toFixed(0)}% por debajo de su máximo de 30 días.`);
  }
  if (vol != null) {
    if (vol >= 5) cons.push(`Se mueve ±${vol.toFixed(1)}% en un día normal. Riesgo ${risk.toLowerCase()}.`);
    else notes.push(`Se mueve ±${vol.toFixed(1)}% en un día normal.`);
  }

  const tags = [];
  tags.push(trend >= 80 ? { t: 'Tendencia alcista', tone: 'up' } : trend <= 20 ? { t: 'Tendencia bajista', tone: 'down' } : { t: 'Tendencia mixta', tone: 'neutral' });
  if (over) tags.push({ t: 'Sobrecomprada', tone: 'warn' });
  if (under) tags.push({ t: 'Sobrevendida', tone: 'warn' });
  if (relVol != null && relVol >= 2) tags.push({ t: `Volumen ${relVol.toFixed(1)}×`, tone: 'info' });
  if (fromHigh != null && fromHigh >= -3) tags.push({ t: 'Cerca de máximos', tone: 'info' });
  if (risk === 'Alto' || risk === 'Muy alto') tags.push({ t: `Riesgo ${risk.toLowerCase()}`, tone: 'warn' });

  const summary = `${perfil}. ${okN} de ${conds.length} señales de tendencia a favor. RSI diario ${rsiD.toFixed(0)}.` +
    (vol != null ? ` Riesgo ${risk.toLowerCase()} (±${vol.toFixed(1)}% en un día normal).` : '');

  return {
    fuerza, trend, impulse, rz, rsiH, rsiD, sma20h, sma50h, sma20d, sma50d, ch7, ch30, vol, relVol, hi30, fromHigh,
    over, under, risk, perfil, tono, pros, cons, notes, tags, okN, nConds: conds.length, summary,
  };
}

/* Resumen del día: list = [{ ch24, a }] */
function marketBrief(list, btcA) {
  const out = [];
  const n = list.length;
  if (!n) return out;
  const up = list.filter((x) => x.ch24 > 0).length;
  out.push({ tone: up / n >= 0.65 ? 'up' : up / n <= 0.35 ? 'down' : 'neutral', text: `${up} de ${n} monedas suben en las últimas 24 h.` });
  if (btcA) {
    out.push({
      tone: btcA.fuerza >= 60 ? 'up' : btcA.fuerza <= 40 ? 'down' : 'neutral',
      text: `Bitcoin: Fuerza ${btcA.fuerza}/100 (${btcA.perfil.toLowerCase()}). Las demás monedas suelen seguir su dirección.`,
    });
  }
  const vols = list.map((x) => x.a && x.a.vol).filter((v) => v != null);
  if (vols.length >= 5) {
    const m = median(vols);
    out.push({
      tone: m >= 4 ? 'warn' : 'neutral',
      text: `Volatilidad típica del grupo: ±${m.toFixed(1)}% por día.` + (m >= 4 ? ' Mercado movido: conviene usar posiciones más pequeñas.' : ''),
    });
  }
  const ob = list.filter((x) => x.a && x.a.over).length;
  if (ob >= 3) out.push({ tone: 'warn', text: `${ob} monedas con RSI alto (70 o más). Después de subidas rápidas son comunes las pausas.` });
  return out;
}

/* ---------- cartera y riesgo ---------- */
function positionSize({ capital, riskPct, entry, stop }) {
  if (!(capital > 0) || !(riskPct > 0) || !(entry > 0) || !(stop > 0)) return null;
  const loss = entry - stop;
  if (!(loss > 0)) return { error: 'El stop-loss debe estar por debajo del precio de entrada.' };
  const wantedRisk = (capital * riskPct) / 100;
  let qty = wantedRisk / loss;
  let capped = false;
  if (qty * entry > capital) { qty = capital / entry; capped = true; }
  const value = qty * entry;
  return { wantedRisk, risk: qty * loss, qty, value, pctOfCapital: (value / capital) * 100, stopPct: (loss / entry) * 100, capped };
}
function plOf(pos, price) {
  const cost = pos.qty * pos.entry, value = pos.qty * price;
  return { cost, value, pl: value - cost, pct: cost > 0 ? (value / cost - 1) * 100 : null };
}

/* ---------- alertas ---------- */
/* c = { price, ch1h, rsiH }  →  true | false | null (sin datos) */
function alertCond(a, c) {
  if (a.type === 'price') {
    if (!(c.price > 0)) return null;
    return a.dir === 'up' ? c.price >= a.target : c.price <= a.target;
  }
  if (a.type === 'move1h') {
    if (c.ch1h == null) return null;
    return a.dir === 'up' ? c.ch1h >= a.pct : a.dir === 'down' ? c.ch1h <= -a.pct : Math.abs(c.ch1h) >= a.pct;
  }
  if (a.type === 'rsi') {
    if (c.rsiH == null) return null;
    return a.dir === 'below' ? c.rsiH <= a.level : c.rsiH >= a.level;
  }
  return null;
}
/* Estados: waiting (la condición ya se cumplía al crear; espera a que deje de cumplirse) → armed → fired */
function alertStep(a, c) {
  if (a.state === 'fired') return { state: 'fired', fire: false };
  const cond = alertCond(a, c);
  if (cond === null) return { state: a.state, fire: false };
  if (a.state === 'waiting') return { state: cond ? 'waiting' : 'armed', fire: false };
  if (cond) return { state: 'fired', fire: true };
  return { state: 'armed', fire: false };
}
function makeAlert(f, c) {
  const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const base = { id, sym: f.sym, type: f.type, created: Date.now(), state: 'armed' };
  if (f.type === 'price') {
    const t = f.target;
    if (!(t > 0) || !isFinite(t)) return { error: 'Escribe un precio mayor que 0.' };
    if (!(c.price > 0)) return { error: 'Todavía no hay precio en vivo de esta moneda. Espera un momento.' };
    if (t === c.price) return { error: 'Ese es el precio actual. Elige otro valor.' };
    const dir = t > c.price ? 'up' : 'down';
    if (f.dir && f.dir !== dir) {
      return { error: f.dir === 'up' ? `Para «Sube a», el precio debe ser mayor que el actual (${fmtPrice(c.price)}).` : `Para «Baja a», el precio debe ser menor que el actual (${fmtPrice(c.price)}).` };
    }
    return { alert: { ...base, dir, target: t } };
  }
  if (f.type === 'move1h') {
    const p = f.pct;
    if (!(p > 0) || p > 50) return { error: 'Escribe un porcentaje entre 0.1 y 50.' };
    const dir = ['up', 'down', 'any'].includes(f.dir) ? f.dir : 'any';
    const a = { ...base, dir, pct: p };
    a.state = alertCond(a, c) === false ? 'armed' : 'waiting';
    return { alert: a };
  }
  if (f.type === 'rsi') {
    const l = f.level;
    if (!(l >= 1 && l <= 99)) return { error: 'El RSI va de 1 a 99. Ejemplo: 30 o 70.' };
    const a = { ...base, dir: f.dir === 'above' ? 'above' : 'below', level: l };
    a.state = alertCond(a, c) === false ? 'armed' : 'waiting';
    return { alert: a };
  }
  return { error: 'Tipo de alerta no válido.' };
}
function describeAlert(a) {
  if (a.type === 'price') return (a.dir === 'up' ? 'Sube a ' : 'Baja a ') + fmtPrice(a.target) + ' USDT';
  if (a.type === 'move1h') return a.dir === 'up' ? `Sube ${a.pct}% en 1 h` : a.dir === 'down' ? `Baja ${a.pct}% en 1 h` : `Se mueve ±${a.pct}% en 1 h`;
  if (a.type === 'rsi') return `RSI (1 h) ${a.dir === 'below' ? 'baja de' : 'sube de'} ${a.level}`;
  return '';
}
function alertMessage(a, c) {
  const b = baseOf(a.sym);
  if (a.type === 'price') {
    return `${b} ${a.dir === 'up' ? 'subió' : 'bajó'} a ${fmtPrice(c.price)} USDT (objetivo ${fmtPrice(a.target)}).`;
  }

    pump();

}

  while (Q.running < Q.max && Q.items.length) {

    Q.running++;

  }

const SVGNS = 'http://www.w3.org/2000/svg';

const RADAR = [
  { id: 'top', title: 'Mayor Fuerza' },

const RADAR_NOTE = 'Fuerza resume tendencia, impulso y RSI de lo que ya pasó. RSI alto: subió mucho y rápido; son comunes las pausas. RSI bajo: puede rebotar o seguir cayendo.';

const VMarket = {
  rows: new Map(),
  order: '',

  sort: 'vol',
  favOnly: false,
  briefOk: false,
  radarOk: false,
  qTimer: 0,

  init() {
    const root = $('#v-mercado');

      class: 'input', type: 'search', placeholder: 'Buscar moneda (BTC, PEPE…)', 'aria-label': 'Buscar moneda',
      autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'search', oninput: () => this.onSearch(),
    });

    this.sortBtns = {};
    const sortRow = h('div', { class: 'chips', role: 'group', 'aria-label': 'Ordenar y filtrar' });
    SORTS.forEach(([id, label]) => {

    });
    this.favBtn = h('button', { class: 'chip', type: 'button', 'aria-pressed': 'false', onclick: () => { this.favOnly = !this.favOnly; this.syncChips(); this.render(); } }, icon('star'), 'Favoritas');
    sortRow.append(this.favBtn);

    this.list = h('ul', { class: 'coins' });

    root.append(
      h('section', { class: 'card' }, h('h2', { class: 'card-t', text: 'Resumen de hoy' }), this.briefList),
      h('section', { class: 'card' }, h('h2', { class: 'card-t', text: 'Radar' }), this.radarBox),
      h('div', { class: 'tools' }, search, sortRow),
      this.list,
      this.empty,
      h('p', { class: 'disc', text: 'Señales informativas con datos públicos de Binance. No son asesoría financiera: invertir en criptomonedas puede hacerte perder todo el dinero.' }),
    );
    this.refreshBrief();
    this.refreshRadar();
    this.showSkeleton();
  },

  showSkeleton() {
    this.order = '';
    this.list.replaceChildren(...[0, 1, 2, 3, 4, 5].map(() => h('li', { class: 'skel', 'aria-hidden': 'true' })));
  },
  syncChips() {
    for (const id in this.sortBtns) this.sortBtns[id].setAttribute('aria-pressed', String(id === this.sort));
    this.favBtn.setAttribute('aria-pressed', String(this.favOnly));
  },

  onSearch() {
    clearTimeout(this.qTimer);
    this.qTimer = setTimeout(() => {
      S.ui.q = this.input.value.trim();
      S.searchSyms = S.ui.q ? this.searchResults(S.ui.q) : [];
      onTrackedChanged();
      this.render();
    }, 150);
  },
  searchResults(q) {
    const t = q.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!t) return [];
    const first = [], rest = [];
    for (const sym of S.allUSDT) {
      const b = baseOf(sym), nm = (NAMES[b] || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (b === t) first.unshift(sym);
      else if (b.startsWith(t)) first.push(sym);
      else if (b.includes(t) || (nm && nm.includes(t))) rest.push(sym);
    }
    return [...first, ...rest].slice(0, 15);
  },

  visibleSyms() {
    if (S.ui.q) return S.searchSyms.filter((s) => S.M.has(s));
    let list = [...new Set([...S.universe, ...S.watch])].filter((s) => S.M.has(s));
    if (this.favOnly) list = list.filter((s) => S.watch.includes(s));
    const key = this.sort;
    const val = (s) => {
      const m = S.M.get(s);
      let v;
      if (key === 'vol') v = m.qvol;
      else if (key === 'up') v = m.ch24;
      else if (key === 'down') v = -m.ch24;
      else { const a = analysisOf(s); v = a ? a.fuerza : -1; }
      return isFinite(v) ? v : -1e18;
    };
    return list.sort((x, y) => val(y) - val(x));
  },

  render() {
    if (!S.ready) return;
    const syms = this.visibleSyms();
    const sig = syms.join();
    const keep = new Set(syms);
    for (const [s, r] of this.rows) if (!keep.has(s)) { r.li.remove(); this.rows.delete(s); }
    const frag = [];
    for (const s of syms) {
      let r = this.rows.get(s);
      if (!r) { r = this.makeRow(s); this.rows.set(s, r); }
      this.updateRow(r, true);
      frag.push(r.li);
    }
    const first = this.list.firstChild;
    if (sig !== this.order || !first || first.classList.contains('skel')) {
      this.list.replaceChildren(...frag);
      this.order = sig;
    }
    let msg = '';
    if (!syms.length) {
      if (S.ui.q) msg = 'No encontré «' + S.ui.q + '» entre los pares USDT de Binance.';
      else if (this.favOnly) msg = 'Aún no tienes favoritas. Toca la estrella de una moneda para guardarla aquí.';
      else msg = 'No hay monedas para mostrar.';
    }
    this.empty.hidden = !msg;
    setText(this.empty, msg);
  },

  makeRow(sym) {
    const base = baseOf(sym);
    const r = { sym, hasA: false, fl: 'a', tone: null, fav: null };
    r.star = h('button', { class: 'star', type: 'button', 'aria-pressed': 'false', onclick: () => UI.toggleWatch(sym) }, icon('star'));
    r.px = h('b', { class: 'px', text: '—' });
    r.chg = h('small', { class: 'chg', text: '—' });
    r.score = h('span', { class: 'score', text: '—', title: 'Fuerza de 0 a 100' });
    r.spark = document.createElementNS(SVGNS, 'svg');
    r.spark.setAttribute('viewBox', '0 0 56 24');
    r.spark.setAttribute('class', 'spark');
    r.spark.setAttribute('aria-hidden', 'true');
    r.path = document.createElementNS(SVGNS, 'path');
    r.spark.append(r.path);
    r.main = h('button', { class: 'coin-main', type: 'button', onclick: () => UI.openCoin(sym) },
      h('span', { class: 'coin-id' }, h('b', { text: base }), h('small', { text: NAMES[base] || 'Par con USDT' })),
      r.spark,
      h('span', { class: 'coin-px' }, r.px, r.chg),
      r.score);
    r.li = h('li', { class: 'coin' }, r.star, r.main);
    return r;
  },

  updateRow(r, full) {
    const m = S.M.get(r.sym);
    if (!m || !(m.last > 0)) return;
    const t = fmtPrice(m.last);
    if (r.px.textContent !== t) {
      r.px.textContent = t;
      if (m.dir) { r.fl = r.fl === 'a' ? 'b' : 'a'; r.px.className = 'px fl-' + (m.dir > 0 ? 'up' : 'dn') + '-' + r.fl; }
    }
    setText(r.chg, fmtPct(m.ch24));
    const tone = toneOf(m.ch24);
    if (r.tone !== tone) { r.tone = tone; r.chg.className = 'chg ' + tone; }
    const fav = S.watch.includes(r.sym);
    if (r.fav !== fav) {
      r.fav = fav;
      r.star.setAttribute('aria-pressed', String(fav));
      r.star.setAttribute('aria-label', (fav ? 'Quitar ' : 'Agregar ') + baseOf(r.sym) + (fav ? ' de favoritas' : ' a favoritas'));
    }
    if (!full && r.hasA) return;
    const a = analysisOf(r.sym);
    r.hasA = !!a;
    if (a) {
      setText(r.score, String(a.fuerza));
      r.score.className = 'score ' + (a.tono === 'neutral' ? '' : a.tono);
      r.score.title = 'Fuerza ' + a.fuerza + ' de 100 · ' + a.perfil;
    }
    const k = S.K.get(r.sym), rows = k && k.data['1h'] && k.data['1h'].rows;
    if (rows && rows.length > 24) {
      const cl = rows.slice(-24).map((x) => x.c);
      cl[cl.length - 1] = m.last;
      r.path.setAttribute('d', sparkPath(cl, 56, 24));
      r.spark.setAttribute('class', 'spark ' + (cl[cl.length - 1] >= cl[0] ? 'up' : 'down'));
    }
  },

  onData(syms) {
    if (UI.tab !== 'mercado' || !this.rows.size) return;
    for (const s of syms) {
      const r = this.rows.get(s);
      if (r) this.updateRow(r, false);
    }
  },

  tick(n) {
    if (UI.tab !== 'mercado' || document.hidden || !S.ready) return;
    if (n % 5 === 0) this.softRender();
    if (n % (this.briefOk ? 10 : 2) === 0) this.refreshBrief();
    if (n % (this.radarOk ? 10 : 2) === 0) this.refreshRadar();
  },
  softRender() {
    const busy = Date.now() - this.lastTouch < 4000 || this.list.contains(document.activeElement);
    if (busy) this.rows.forEach((r) => this.updateRow(r, true));
    else this.render();
  },

  refreshBrief() {
    const list = [];
    for (const sym of S.universe) {
      const m = S.M.get(sym);
      if (m && isFinite(m.ch24)) list.push({ ch24: m.ch24, a: analysisOf(sym) });
    }
    const btcA = analysisOf('BTCUSDT');
    this.briefOk = !!btcA;
    const items = marketBrief(list, btcA);
    const lis = items.length
      ? items.map((x) => h('li', null, h('span', { class: 'dot ' + (x.tone === 'neutral' ? '' : x.tone) }), h('span', { text: x.text })))
      : [h('li', null, h('span', { class: 'dot' }), h('span', { class: 'muted', text: 'Calculando…' }))];
    this.briefList.replaceChildren(...lis);
  },
  refreshRadar() {
    const items = [];
    for (const sym of S.universe) {
      const a = analysisOf(sym);
      if (a) items.push({ sym, a });
    }
    this.radarOk = items.length >= 3;
    const chip = (x, label, tone) => h('button', { class: 'chip rc ' + tone, type: 'button', onclick: () => UI.openCoin(x.sym) }, h('b', { text: baseOf(x.sym) }), h('span', { text: label }));
    const top = [...items].sort((p, q) => q.a.fuerza - p.a.fuerza).slice(0, 4)
      .map((x) => chip(x, ' ' + x.a.fuerza, x.a.tono === 'neutral' ? '' : x.a.tono));
    const hot = items.map((x) => ({ x, v: Math.max(x.a.rsiH, x.a.rsiD) })).filter((o) => o.v >= 70)
      .sort((p, q) => q.v - p.v).slice(0, 4).map((o) => chip(o.x, ' RSI ' + Math.round(o.v), 'warn'));
    const cold = items.map((x) => ({ x, v: Math.min(x.a.rsiH, x.a.rsiD) })).filter((o) => o.v <= 30)
      .sort((p, q) => p.v - q.v).slice(0, 4).map((o) => chip(o.x, ' RSI ' + Math.round(o.v), 'warn'));
    const fill = (id, arr) => this.radarEls[id].replaceChildren(...(arr.length ? arr : [h('span', { class: 'hint', text: this.radarOk ? 'Ninguna por ahora.' : 'Calculando…' })]));
    fill('top', top);
    fill('hot', hot);
    fill('cold', cold);
  },
};

    const rows = liveSeries(this.sym, this.iv);
    const w = IV_WINDOW[this.iv] || 100;
    drawChart(this.cv, rows, { type: this.type, iv: this.iv, window: this.type === 'candle' ? Math.min(w, 60) : w, hover: this.hover, levels: this.levels() });
    const msg = !rows && this.err ? this.err : '';
    this.chartMsg.hidden = !msg;
    setText(this.chartMsg, msg);
  },

  renderLive() {
    const sym = this.sym, m = S.M.get(sym);
    if (!m || !(m.last > 0)) return;
    const t = fmtPrice(m.last);
    if (this.px.textContent !== t) {
      this.px.textContent = t;
      this.px.className = 'price-big ' + (m.dir > 0 ? 't-up' : m.dir < 0 ? 't-down' : '');
      clearTimeout(this.pxT);
      this.pxT = setTimeout(() => { this.px.className = 'price-big'; }, 700);
    }
    const pill = (el, label, v) => {
      setText(el, label + ' ' + fmtPct(v));
      el.className = 'pill ' + toneOf(v);
    };
    pill(this.p24, '24 h', m.ch24);
    pill(this.p1h, '1 h', S.W1.has(sym) ? S.W1.get(sym) : null);
    this.updStale();
    const a = analysisOf(sym);
    if (a && !this.hasA) this.renderAnalysis();
    this.statEls.forEach((s) => {
      const txt = s.fn(m, a);
      setText(s.dd, txt);
      if (s.pct) s.dd.className = txt[0] === '+' ? 't-up' : txt[0] === MINUS ? 't-down' : '';
    });
    this.draw();
  },
  updStale() {
    const m = S.M.get(this.sym);
    const old = !S.demo && m && S.ready && Date.now() - m.t > 20000;
    this.stale.hidden = !old;
    if (old) setText(this.stale, 'Sin datos nuevos hace ' + ago(Date.now() - m.t));
  },
  renderAnalysis() {
    const a = analysisOf(this.sym), box = this.analysis;
    this.hasA = !!a;
    box.replaceChildren(h('h2', { class: 'card-t', text: 'Análisis automático' }));
    if (!a) {
      box.append(h('p', { class: 'hint', text: this.err ? 'No se pudo calcular: ' + this.err : 'Calculando… necesita el historial de velas de Binance.' }));
      return;
    }
    const tone = a.tono === 'neutral' ? '' : a.tono;
    box.append(...[
      h('div', { class: 'gauge' },
        h('div', { class: 'gauge-bar ' + tone, role: 'img', 'aria-label': 'Fuerza ' + a.fuerza + ' de 100' }, h('i', { style: 'width:' + a.fuerza + '%' })),
        h('div', null, h('b', { text: a.fuerza }), h('small', { text: ' /100 Fuerza' }))),
      h('p', { class: 'perfil', text: a.perfil }),
      h('div', { class: 'chips', style: 'margin-top:8px' }, a.tags.map((t) => h('span', { class: 'pill ' + (t.tone === 'neutral' ? '' : t.tone), text: t.t }))),
      h('p', { class: 'sumline', text: a.summary }),
      lstBox('pro', 'A favor', a.pros),
      lstBox('con', 'En contra', a.cons),
      lstBox('note', 'A tener en cuenta', a.notes),
      h('p', { class: 'hint', style: 'margin-top:12px', text: 'Fuerza resume tendencia, impulso y RSI de lo que ya pasó. No predice el precio ni es una recomendación de compra o venta.' }),
    ].filter(Boolean));
  },

  onData(syms) {
    if (!this.sym || $('#sheet').hidden) return;
    if (syms.includes(this.sym) || syms.includes('*w1')) this.renderLive();
  },
  tick(n) {
    if (!this.sym || $('#sheet').hidden) return;
    this.updStale();
    if (n % 3 === 0) this.renderAnalysis();
  },
};

const ALERT_TYPES = [['price', 'Precio'], ['move1h', 'Movimiento en 1 hora'], ['rsi', 'RSI de 1 hora']];

function alertCtxNow(sym) {
  const m = S.M.get(sym);
  return { price: m ? m.last : null, ch1h: S.W1.has(sym) ? S.W1.get(sym) : null, rsiH: rsiNow(sym) };
}
function alertNow(a) {
  const m = S.M.get(a.sym);
  if (a.type === 'price') return m && m.last > 0 ? 'Ahora ' + fmtPrice(m.last) + ' · el objetivo está a ' + fmtPct((a.target / m.last - 1) * 100, 1) : 'Esperando precio…';
  if (a.type === 'move1h') return S.W1.has(a.sym) ? 'Última hora: ' + fmtPct(S.W1.get(a.sym), 1) : 'Calculando…';
  const v = rsiNow(a.sym);
  return v == null ? 'Calculando RSI…' : 'RSI (1 h) ahora: ' + v.toFixed(0);
}

const VAlerts = {
  nowEls: new Map(),

  },

  form(fixed) {

    const opts = (list) => list.map(([v, l]) => h('option', { value: v, text: l }));
    const coin = h('input', { class: 'input', id: ids.c, list: 'coinlist', placeholder: 'Ej. BTC', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', value: fixed ? baseOf(fixed) : '', readonly: !!fixed });
    const type = h('select', { class: 'select', id: ids.t }, opts(ALERT_TYPES));
    const target = h('input', { class: 'input', id: ids.p, inputmode: 'decimal', placeholder: 'Ej. 70000', autocomplete: 'off' });

    const pRsi = h('div', { class: 'two' }, field('Condición', rdir, ids.r), field('Nivel (1 a 99)', level, ids.l));

    const f = h('form', { class: 'form', novalidate: true }, field('Moneda', coin, ids.c), field('Tipo', type, ids.t), pPrice, pMove, pRsi, prev, err,
      h('button', { class: 'btn primary', type: 'submit', text: 'Crear alerta' }));

    const preview = () => {
      err.textContent = '';

      pMove.hidden = type.value !== 'move1h';
      pRsi.hidden = type.value !== 'rsi';
      const sym = normSym(coin.value), m = S.M.get(sym), b = sym ? baseOf(sym) : 'la moneda';
      let t = '';
      if (!m) t = coin.value.trim() ? 'Escribe una moneda que exista en Binance con USDT (por ejemplo BTC).' : '';
      else if (type.value === 'price') {
        const v = parseNum(target.value);
        t = 'Precio actual: ' + fmtPrice(m.last) + ' USDT.' +
          (v > 0 && v !== m.last ? ' Te aviso cuando ' + b + (v > m.last ? ' suba' : ' baje') + ' a ' + fmtPrice(v) + ' (' + fmtPct((v / m.last - 1) * 100, 1) + ' desde ahora).' : '');
      } else if (type.value === 'move1h') {
        const v = parseNum(pct.value);
        t = v > 0 ? 'Te aviso si ' + b + ' ' + (mdir.value === 'up' ? 'sube' : mdir.value === 'down' ? 'baja' : 'se mueve') + ' ' + v + '% o más en 1 hora.' : '';
      } else {
        const v = parseNum(level.value), r = rsiNow(sym);
        t = v > 0 ? 'Te aviso cuando el RSI de 1 hora de ' + b + (rdir.value === 'below' ? ' baje de ' : ' suba de ') + v + '.' + (r != null ? ' Ahora está en ' + r.toFixed(0) + '.' : '') : '';
      }
      prev.textContent = t;
    };
    rdir.addEventListener('change', () => { level.value = rdir.value === 'below' ? '30' : '70'; });
    f.addEventListener('input', preview);
    f.addEventListener('change', preview);
    f.addEventListener('submit', (e) => {
      e.preventDefault();

      const ty = type.value;

          : { sym, type: ty, level: parseNum(level.value), dir: rdir.value };
      const r = makeAlert(spec, alertCtxNow(sym));

    const p = notifSupported() ? Notification.permission : 'unsupported';

    if (p === 'unsupported') msg = 'Este navegador no permite notificaciones del sistema. Verás el aviso dentro de la app, con sonido y vibración.';
    else if (p === 'default') {
      msg = 'Activa los avisos del sistema para ver las alertas aunque estés en otra pestaña o app.';

    box.replaceChildren(...[
      h('h2', { class: 'card-t', text: 'Avisos' }),

      h('p', { class: 'hint', text: 'Las alertas se revisan solo mientras Pulso está abierto. Si cierras la pestaña o el navegador, no avisan. Para avisos con la app cerrada, usa las alertas de la app de Binance.' }),
    ].filter(Boolean));
  },

  subText(a) {
    return (a.state === 'waiting' ? 'En espera: ya se cumple ahora; avisa si deja de cumplirse y vuelve a ocurrir. ' : '') + alertNow(a);
  },
  item(a) {
    const li = h('li', { class: 'alert-item' + (a.state === 'fired' ? ' fired' : '') });
    const title = h('div', { class: 'al-title' }, h('button', { type: 'button', text: baseOf(a.sym), onclick: () => UI.openCoin(a.sym) }), ' · ' + describeAlert(a));
    const sub = h('div', { class: 'al-sub' });
    if (a.state === 'fired') sub.textContent = 'Avisó hace ' + ago(Date.now() - a.firedAt) + (a.firedPrice > 0 ? ' · precio ' + fmtPrice(a.firedPrice) : '');
    else { sub.textContent = this.subText(a); this.nowEls.set(a.id, { a, el: sub }); }
    const act = h('div', { class: 'al-act' });
    if (a.state === 'fired') act.append(h('button', { class: 'btn sm', type: 'button', text: 'Reactivar', onclick: () => this.rearm(a) }));
    act.append(h('button', { class: 'icon-btn danger', type: 'button', 'aria-label': 'Borrar alerta de ' + baseOf(a.sym), onclick: () => this.remove(a) }, icon('trash')));
    li.append(title, sub, act);

  },
  renderList() {
    const box = this.listBox;
    this.nowEls.clear();
    box.replaceChildren(h('h2', { class: 'card-t', text: 'Mis alertas' }));
    if (!S.alerts.length) {
      box.append(h('p', { class: 'empty', text: 'Aún no tienes alertas. Crea una arriba: avisa una sola vez cuando se cumpla la condición.' }));
      return;

    const act = S.alerts.filter((a) => a.state !== 'fired'), done = S.alerts.filter((a) => a.state === 'fired');
    if (act.length) box.append(h('ul', { class: 'alert-list' }, act.map((a) => this.item(a))));
    if (done.length) box.append(h('h2', { class: 'card-t', style: 'margin:16px 0 8px', text: 'Ya avisaron' }), h('ul', { class: 'alert-list' }, done.map((a) => this.item(a))));
  },
  renderLog() {
    const box = this.logBox;
    box.replaceChildren(h('h2', { class: 'card-t', text: 'Últimos avisos' }));
    if (!S.log.length) {
      box.append(h('p', { class: 'hint', text: 'Cuando una alerta salte, queda registrada aquí.' }));
      return;

    box.append(

  },

  rearm(a) {
    a.state = alertCond({ ...a, state: 'armed' }, alertCtxNow(a.sym)) === false ? 'armed' : 'waiting';
    delete a.firedAt;
    delete a.firedPrice;
    saveStore();
    onTrackedChanged();
    this.render();
    VCoin.draw();

  remove(a) {
    S.alerts = S.alerts.filter((x) => x.id !== a.id);
    saveStore();
    onTrackedChanged();
    this.render();
    VCoin.draw();
  },

  onData(syms) {
    if (!this.nowEls.size) return;
    for (const { a, el } of this.nowEls.values()) {
      if (syms.includes(a.sym) || syms.includes('*w1')) setText(el, this.subText(a));
    }
  },
};

const VWallet = {

    const risk = num(ids.r, 'Ej. 1', '1');
    const coin = h('input', { class: 'input', id: ids.s, list: 'coinlist', placeholder: 'Opcional', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false' });
    const entry = num(ids.e, 'Precio de entrada');
    const stop = num(ids.x, 'Precio del stop-loss');
    const target = num(ids.t, 'Opcional');
    const res = h('div', { class: 'res', 'aria-live': 'polite' });
    const f = h('form', { class: 'form', novalidate: true },
      h('div', { class: 'two' }, field('Tu capital (USDT)', capital, ids.c), field('Riesgo (%)', risk, ids.r)),
      h('p', { class: 'hint', text: 'Riesgo = lo que aceptas perder si la operación sale mal. Una regla común es 1 % o 2 % del capital.' }),
      h('div', { class: 'two' }, field('Moneda', coin, ids.s), field('Entrada (USDT)', entry, ids.e)),
      h('div', { class: 'two' }, field('Stop-loss (USDT)', stop, ids.x), field('Objetivo (USDT)', target, ids.t)),
      res);
    f.addEventListener('submit', (e) => e.preventDefault());
    const upd = () => {
      const sym = normSym(coin.value), m = S.M.get(sym), base = m ? baseOf(sym) : 'unidades';
      const cap = parseNum(capital.value), rp = parseNum(risk.value), en = parseNum(entry.value), st = parseNum(stop.value), tg = parseNum(target.value);
      const r = positionSize({ capital: cap, riskPct: rp, entry: en, stop: st });
      res.replaceChildren();
      if (!r) { res.append(h('span', { class: 'muted', text: 'Completa capital, riesgo, entrada y stop-loss para ver el resultado.' })); return; }
      if (r.error) { res.append(warnLine(r.error)); return; }
      res.append(
        h('span', null, 'Compras ', h('b', { text: fmtQty(r.qty) + ' ' + base }), ' = ', h('b', { text: fmtUSDT(r.value) + ' USDT' }), ' (' + r.pctOfCapital.toFixed(0) + '% de tu capital).'),
        h('span', null, 'Si llega al stop (' + fmtPct(-r.stopPct, 1) + '), pierdes ', h('b', { text: fmtUSDT(r.risk) + ' USDT' }), ' (' + ((r.risk / cap) * 100).toFixed(2) + '% del capital).'));
      if (tg > en) {
        res.append(h('span', null, 'Si llega al objetivo (' + fmtPct((tg / en - 1) * 100, 1) + '), ganas ', h('b', { text: fmtUSDT(r.qty * (tg - en)) + ' USDT' }),
          '. Relación beneficio/riesgo: ', h('b', { text: ((tg - en) / (en - st)).toFixed(1) + ' a 1' }), '.'));
      } else if (target.value.trim()) res.append(warnLine('El objetivo debe estar por encima de la entrada.'));
      if (r.capped) res.append(warnLine('Tu capital no alcanza para ese riesgo: la posición usa todo el capital.'));
      if (r.stopPct < 0.5) res.append(warnLine('Un stop tan cerca puede saltar por el movimiento normal del precio.'));
      if (r.pctOfCapital > 50) res.append(warnLine('Más de la mitad de tu capital quedaría en una sola moneda.'));
      res.append(h('span', { class: 'hint', text: 'No incluye comisiones. En caídas bruscas el stop puede ejecutarse a un precio peor.' }));
    };
    f.addEventListener('input', (e) => {
      if (e.target === coin) {
        const m = S.M.get(normSym(coin.value));
        if (m && (!entry.value || entry.dataset.auto)) { entry.value = fmtPrice(m.last).replace(/,/g, ''); entry.dataset.auto = '1'; }
      } else if (e.target === entry) delete entry.dataset.auto;
      upd();
    });
    upd();
    return f;
  },
};

'use strict';
/* ==========================================================================
   Pulso · arranque, ciclo de vida y respaldo por consulta periódica
   ========================================================================== */

let tickN = 0;
let lastPoll = 0;
let bootTries = 0;
let startTimer = 0;
let starting = false;

/* Respaldo: si el WebSocket no llega, consulta los precios cada 5 s */
async function pollOnce() {
  const syms = [...wsWanted()].filter((s) => S.M.has(s)).slice(0, 100);
  if (!syms.length) return;
  const rows = await rest('/api/v3/ticker/24hr', { symbols: syms }, 8000);
  if (!Array.isArray(rows)) return;
  S.conn.pollAt = Date.now();
  for (const r of rows) {
    onTicker({ e: '24hrMiniTicker', s: r.symbol, c: r.lastPrice, o: r.openPrice, h: r.highPrice, l: r.lowPrice, v: r.volume, q: r.quoteVolume });
  }
}

function everySecond() {
  tickN++;
  if (S.ready && !S.demo) {
    wsWatchdog();
    const live = S.conn.status === 'live' && Date.now() - S.conn.lastMsg < 8000;
    if (!live && Date.now() - lastPoll > 5000) {
      lastPoll = Date.now();
      pollOnce().catch(() => {});
    }
  }
  UI.tick(tickN);
}

function slowJobs() {
  if (!S.ready) return;
  maintenance();
  refreshW1().catch(() => {});
}
async function refreshUniverse() {
  if (!S.ready || S.demo) return;
  try {
    await loadUniverse();
    UI.fillCoinList();
    onTrackedChanged();
    VMarket.render();
  } catch (e) { /* se reintenta en el próximo ciclo */ }
}

async function start() {
  if (starting) return;
  starting = true;
  clearTimeout(startTimer);
  try {
    UI.updateStatus();
    if (S.demo) UI.banner('info', 'Modo ejemplo: los precios son simulados. Sirve para ver cómo funciona la app.');
    else UI.clearBanner();
    try {
      await loadUniverse();
    } catch (e) {
      S.conn.status = 'down';
      UI.updateStatus();
      UI.banner('err', 'No pude conectar con Binance (' + (e.message || 'error de red') + '). Revisa tu internet. Reintento solo.', 'Reintentar ahora', () => start());
      startTimer = setTimeout(start, Math.min(60000, 5000 * ++bootTries));
      return;
    }
    bootTries = 0;
    S.ready = true;
    UI.fillCoinList();
    if (S.demo) demoStart(); else wsConnect();
    maintenance();
    refreshW1().catch(() => {});
    VMarket.render();
    VMarket.refreshBrief();
    VMarket.refreshRadar();
    VWallet.render();
    UI.updateStatus();
  } finally {
    starting = false;
  }
}

function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(setSwReg).catch(() => { /* sin service worker: avisos solo dentro de la página */ });
}

function boot() {
  S.demo = /[?&]demo(=|&|$)/.test(location.search);
  loadStore();
  UI.init();
  registerSW();
  start();
  setInterval(everySecond, 1000);
  setInterval(slowJobs, 60000);
  setInterval(refreshUniverse, 30 * 60000);
  if (S.settings.wake) setWake(true);
  document.addEventListener('visibilitychange', () => {
    wsSync();
    if (document.hidden) return;
    if (S.ready) {
      maintenance();
      refreshW1().catch(() => {});
      if (!S.demo) wsWatchdog();
    }
    if (S.settings.wake) setWake(true);
  });
  window.addEventListener('online', () => {
    if (!S.ready) start();
    else if (!S.demo) wsRestart();
  });
}
boot();
